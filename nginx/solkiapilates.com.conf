# =========================================================================
# 8. SOLKIA PILATES (Corregido y Unificado)
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name solkiapilates.com www.solkiapilates.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name solkiapilates.com www.solkiapilates.com;

    client_max_body_size 50M;

    ssl_certificate "/home/Certificados SSL/solkiapilates.com.crt";
    ssl_certificate_key "/home/Certificados SSL/solkiapilates.com.key";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
